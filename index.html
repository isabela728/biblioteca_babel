<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Babel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4 mb-3">Biblioteca de Babel</h1>
            <p class="lead text-muted fst-italic">
                A biblioteca está dividida em câmaras hexagonais, cada uma com 4 paredes de estantes, 
                cinco prateleiras por parede e 32 volumes por prateleira.
            </p>
        </header>

        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#explorar">
                    Explorar
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#buscar">
                    Buscar
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="explorar">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label small">Câmara</label>
                                <input type="text" class="form-control" id="camara" value="4a8b1c0d" maxlength="8">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small">Parede (1-4)</label>
                                <input type="number" class="form-control" id="parede" min="1" max="4" value="2">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small">Prateleira (1-5)</label>
                                <input type="number" class="form-control" id="prateleira" min="1" max="5" value="3">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small">Volume (1-32)</label>
                                <input type="number" class="form-control" id="volume" min="1" max="32" value="12">
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" onclick="abrirPagina()">Abrir</button>
                            <button class="btn btn-outline-secondary" onclick="aleatorio()">Aleatório</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div id="conteudo" class="texto-pagina mb-3">Carregando...</div>
                        <div class="text-muted small" id="info">---</div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="buscar">
                <div class="card mb-4">
                    <div class="card-body">
                        <label class="form-label">Digite o texto que deseja encontrar</label>
                        <textarea class="form-control mb-3" id="textoBusca" rows="3" 
                            placeholder="Qualquer texto que você imaginar..."></textarea>
                        
                        <button class="btn btn-primary" onclick="buscar()">Procurar</button>
                    </div>
                </div>

                <div id="resultado" class="card" style="display: none;">
                    <div class="card-body">
                        <h5 class="card-title">Encontrado!</h5>
                        <p class="font-monospace text-primary" id="coordenadas"></p>
                        <button class="btn btn-success" id="irPara">Ver Página</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
